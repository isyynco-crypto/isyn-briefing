<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ISYN Co. | Briefing Inteligente</title>
<!-- Favicon / app icon: reservado para o símbolo da ISYN Co. (ex.: <link rel="icon" href="isyn-icon.png">) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..600;1,6..96,400..500&family=Hanken+Grotesk:wght@300..600&display=swap">
<style>
/* Layout: uma coluna editorial por tela, hairlines no lugar de cards; a Central usa listas com linhas finas. Tema único claro, por escolha da marca. */
:root{
  --paper:#F2F0EC;
  --paper-2:#E9E6E0;
  --ink:#141413;
  --graphite:#3B3A37;
  --muted:#85817A;
  --line:#D6D1C8;
  --line-strong:#AFA99E;
  --ok:#3D5B47;
  --alert:#8C4A2B;
  --serif:"Bodoni Moda","Bodoni 72","Didot",Georgia,serif;
  --sans:"Hanken Grotesk","Helvetica Neue",Arial,sans-serif;
  --ease:cubic-bezier(.2,.7,.1,1);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:1px solid var(--ink);outline-offset:4px}
::selection{background:var(--ink);color:var(--paper)}

/* ——— Logo (arquivo original, recortado e com fundo transparente) ——— */
.logo{display:block;aspect-ratio:1020/262;background-repeat:no-repeat;background-size:contain;background-position:center;max-width:100%}

/* ——— Header ——— */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding-inline:clamp(16px,4vw,40px);height:64px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.top .logo{width:118px}
.top-nav{display:flex;align-items:center;gap:28px}
.lbl{font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;font-weight:500}
.top-nav .lbl{color:var(--muted)}
.top-nav .here{color:var(--ink)}
.tlink{font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;font-weight:600;padding:8px 0;border-bottom:1px solid transparent;transition:border-color .3s var(--ease)}
.tlink:hover{border-color:var(--ink)}
.menu-btn{display:none;width:40px;height:40px;align-items:center;justify-content:center;flex-direction:column;gap:6px}
.menu-btn span{display:block;width:22px;height:1px;background:var(--ink);transition:transform .3s var(--ease)}
.menu-btn[aria-expanded="true"] span:first-child{transform:translateY(3.5px) rotate(45deg)}
.menu-btn[aria-expanded="true"] span:last-child{transform:translateY(-3.5px) rotate(-45deg)}
.sheet{border-top:1px solid var(--line);padding-inline:16px;padding-block:8px 20px;display:flex;flex-direction:column}
.sheet button{text-align:left;padding:16px 0;border-bottom:1px solid var(--line)}
@media (max-width:720px){
  .top-nav{display:none}
  .menu-btn{display:flex}
  .top .logo{width:100px}
}
@media (min-width:721px){.sheet{display:none!important}}
.progress{height:1px;background:var(--line);position:relative;overflow:hidden}
.progress i{position:absolute;inset:0 auto 0 0;background:var(--ink);transition:width .8s var(--ease)}

/* ——— Estrutura ——— */
.wrap{padding-inline:clamp(16px,5vw,48px)}
.col{max-width:760px;margin:0 auto}
.wide{max-width:1080px;margin:0 auto}
.stage{animation:rise .7s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.btn{display:inline-flex;align-items:center;gap:14px;background:var(--ink);color:var(--paper);padding:17px 30px;font-size:.74rem;letter-spacing:.2em;text-transform:uppercase;font-weight:600;transition:background .3s var(--ease)}
.btn .ar{display:inline-block;transition:transform .35s var(--ease)}
.btn:hover .ar{transform:translateX(5px)}
.btn:hover{background:var(--graphite)}
.btn[disabled]{background:var(--line-strong);cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.btn.ghost:hover{background:var(--ink);color:var(--paper)}
.link{font-size:.74rem;letter-spacing:.2em;text-transform:uppercase;font-weight:600;color:var(--graphite);padding:10px 0}
.link:hover{color:var(--ink)}
.serif{font-family:var(--serif);font-weight:400}
h1,h2,h3{font-family:var(--serif);font-weight:400;text-wrap:balance;margin:0;letter-spacing:-.01em}

/* ——— Abertura ——— */
.intro{min-height:calc(100vh - 66px);display:flex;align-items:center;padding-block:64px}
.intro .col{display:flex;flex-direction:column;align-items:center;text-align:center;gap:0}
.intro .logo{width:min(440px,78vw);animation:logoIn 1.6s var(--ease) both}
@keyframes logoIn{from{opacity:.15;filter:blur(6px);transform:scale(.985)}to{opacity:1;filter:none;transform:none}}
.intro .rule{width:56px;height:1px;background:var(--ink);margin-block:48px 40px;animation:grow 1.2s .5s var(--ease) both;transform-origin:center}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.intro h1{font-size:clamp(2.1rem,5.4vw,3.4rem);line-height:1.1;font-style:italic}
.intro .copy{max-width:34rem;color:var(--graphite);margin-top:28px;display:flex;flex-direction:column;gap:14px;font-size:1.04rem}
.intro .copy p{margin:0}
.meta-row{display:flex;flex-wrap:wrap;justify-content:center;margin-block:40px 44px;border-block:1px solid var(--line)}
.meta-row div{padding:14px 26px;display:flex;flex-direction:column;gap:2px;align-items:center}
.meta-row div+div{border-left:1px solid var(--line)}
.meta-row .lbl{color:var(--muted)}
.meta-row b{font-weight:500;font-size:.95rem}
.intro .actions{display:flex;flex-direction:column;align-items:center;gap:14px}
@media (max-width:520px){.meta-row div+div{border-left:0;border-top:1px solid var(--line)}.meta-row{flex-direction:column;width:100%}}

/* ——— Etapas ——— */
.step{padding-block:44px 80px}
.step-meta{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap}
.step-meta .lbl{color:var(--muted)}
.count{font-family:var(--serif);font-size:1.05rem;font-variant-numeric:tabular-nums lining-nums;letter-spacing:.06em}
.count b{font-weight:500}
.count span{color:var(--muted)}
.step-head{margin-block:56px 52px}
.step-head .eyebrow{color:var(--muted);margin-bottom:18px;display:block}
.step-head h1{font-size:clamp(2.3rem,6vw,3.9rem);line-height:1.04}
.step-head p{color:var(--graphite);max-width:36rem;margin:20px 0 0;font-size:1.04rem}
.saved{font-size:.78rem;color:var(--muted);display:inline-flex;align-items:center;gap:8px}
.saved::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--ok)}
.saved.pending::before{background:var(--line-strong)}

.fields{display:grid;grid-template-columns:1fr 1fr;column-gap:40px;row-gap:40px}
.f{grid-column:1/-1;display:flex;flex-direction:column;gap:10px;min-width:0}
.f.half{grid-column:span 1}
@media (max-width:640px){.fields{grid-template-columns:1fr}.f.half{grid-column:1/-1}}
.f>label,.f>.q{font-size:.98rem;font-weight:500;color:var(--ink);line-height:1.4}
.hint{font-size:.82rem;color:var(--muted)}
.in{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line-strong);padding:8px 0 10px;font-size:1.06rem;line-height:1.5;border-radius:0;transition:border-color .3s var(--ease)}
.in::placeholder{color:#AAA59C}
.in:focus{outline:none;border-bottom-color:var(--ink)}
textarea.in{resize:none;min-height:46px;overflow:hidden}
.err{font-size:.84rem;color:var(--alert)}

.feature{grid-column:1/-1;border-block:1px solid var(--ink);padding-block:36px 40px;display:flex;flex-direction:column;gap:22px;margin-block:12px}
.feature .q{font-family:var(--serif);font-style:italic;font-size:clamp(1.45rem,3.4vw,2rem);line-height:1.25;font-weight:400}
.feature textarea.in{font-size:1.12rem;min-height:110px}
.feature .lbl{color:var(--muted)}

.complete{grid-column:1/-1;display:flex;flex-direction:column;gap:18px;padding-block:28px;border-top:1px solid var(--line)}
.complete .lbl{color:var(--muted)}
.complete-line{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.complete-line span{font-family:var(--serif);font-size:clamp(1.6rem,4vw,2.3rem);white-space:nowrap}
.complete-line .in{flex:1 1 240px;font-family:var(--serif);font-size:clamp(1.3rem,3.2vw,1.8rem);font-style:italic;min-width:0}

.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{border:1px solid var(--line-strong);border-radius:999px;padding:10px 20px;font-size:.95rem;transition:background .25s var(--ease),color .25s var(--ease),border-color .25s var(--ease)}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip[aria-disabled="true"]{opacity:.38;cursor:not-allowed}
.radios{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.radio{display:flex;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid var(--line);text-align:left}
.radio i{width:16px;height:16px;border-radius:50%;border:1px solid var(--line-strong);flex:none;position:relative}
.radio[aria-checked="true"] i{border-color:var(--ink)}
.radio[aria-checked="true"] i::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--ink)}

.drop{border:1px dashed var(--line-strong);padding:30px 20px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;cursor:pointer;transition:border-color .3s,background .3s}
.drop:hover,.drop.over{border-color:var(--ink);background:var(--paper-2)}
.drop b{font-weight:500}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px}
.thumb{position:relative;aspect-ratio:1;background:var(--paper-2);overflow:hidden;max-width:100%}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;background:var(--paper);color:var(--ink);font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center}

.group-title{grid-column:1/-1;display:flex;align-items:center;gap:16px;margin-top:8px}
.group-title .lbl{color:var(--muted);white-space:nowrap}
.group-title::after{content:"";flex:1;height:1px;background:var(--line)}

.step-foot{margin-top:64px;padding-top:28px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}

/* ——— Conclusão ——— */
.done{padding-block:72px 96px;text-align:center}
.done .col{display:flex;flex-direction:column;align-items:center}
.done .logo{width:min(300px,64vw)}
.done h1{font-size:clamp(2.2rem,6vw,3.8rem);font-style:italic;margin-top:48px;line-height:1.08}
.done .copy{max-width:33rem;color:var(--graphite);margin-top:24px;display:flex;flex-direction:column;gap:12px;font-size:1.04rem}
.done .copy p{margin:0}
.checks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-block:52px;border-top:1px solid var(--line);width:100%;text-align:left}
.checks div{display:flex;align-items:center;gap:12px;padding:16px 4px;border-bottom:1px solid var(--line);animation:rise .6s var(--ease) both}
.checks i{width:22px;height:22px;border:1px solid var(--ink);border-radius:50%;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:.72rem;flex:none}
@media (max-width:700px){.checks{grid-template-columns:repeat(2,minmax(0,1fr))}}
.chain{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 10px;color:var(--muted);font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;margin-top:44px}
.chain b{color:var(--ink);font-weight:600}

.export{margin-top:40px;width:100%;text-align:left;border-top:1px solid var(--ink);padding-top:28px;display:flex;flex-direction:column;gap:14px}
.export h3{font-size:1.5rem}
.export p{margin:0;color:var(--graphite)}
.code{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;font-size:.74rem;background:var(--paper-2);padding:14px;max-height:120px;overflow:auto;word-break:break-all;user-select:all}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}

/* ——— Central Estratégica ——— */
.central{padding-block:44px 96px}
.c-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:36px}
.c-head h1{font-size:clamp(2.2rem,5vw,3.4rem);line-height:1.05}
.c-head .lbl{color:var(--muted);display:block;margin-bottom:14px}
.pipe{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding-block:16px;border-block:1px solid var(--line);margin-bottom:40px;font-size:.68rem;letter-spacing:.18em;text-transform:uppercase}
.pipe span{color:var(--muted)}
.pipe span.on{color:var(--ink);font-weight:600}
.pipe em{font-style:normal;color:var(--line-strong)}
.pipe small{font-size:.62rem;letter-spacing:.12em;color:var(--muted);text-transform:none;font-style:italic;font-family:var(--serif)}

.filters{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid var(--ink);margin-bottom:8px}
.filters button{text-align:left;padding:16px 14px 18px 0;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--line);transition:border-color .3s}
.filters button+button{padding-left:14px;border-left:1px solid var(--line)}
.filters button[aria-pressed="true"]{border-bottom:2px solid var(--ink)}
.filters .n{font-family:var(--serif);font-size:2.2rem;line-height:1;font-variant-numeric:tabular-nums lining-nums}
.filters .lbl{color:var(--graphite);font-size:.64rem;line-height:1.4}
@media (max-width:760px){.filters{grid-template-columns:repeat(2,minmax(0,1fr))}.filters button+button{border-left:0;padding-left:0}.filters button:nth-child(even){padding-left:14px;border-left:1px solid var(--line)}}

.clients{display:flex;flex-direction:column}
.client{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1.4fr) auto auto;gap:20px;align-items:center;padding:22px 0;border-bottom:1px solid var(--line);text-align:left;width:100%;transition:padding .35s var(--ease)}
.client:hover{padding-left:10px}
.client .nm{font-family:var(--serif);font-size:1.45rem;line-height:1.2;overflow-wrap:anywhere}
.client .ds{font-size:.88rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.client .dt{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
@media (max-width:760px){.client{grid-template-columns:minmax(0,1fr) auto}.client .ds,.client .dt{display:none}}
.pill{display:inline-flex;align-items:center;gap:8px;font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;font-weight:600;white-space:nowrap;padding:6px 12px;border:1px solid var(--line-strong);border-radius:999px}
.pill i{width:7px;height:7px;border-radius:50%;flex:none;border:1px solid currentColor}
.pill.rascunho{color:var(--muted);border-style:dashed}
.pill.recebido i{background:var(--ink)}
.pill.construcao i{background:linear-gradient(90deg,var(--ink) 50%,transparent 50%);animation:pulse 1.6s infinite}
.pill.concluido{border-color:var(--ok);color:var(--ok)}.pill.concluido i{background:var(--ok)}
.pill.estrategia{background:var(--ink);color:var(--paper);border-color:var(--ink)}.pill.estrategia i{background:var(--paper)}
@keyframes pulse{50%{opacity:.35}}

.empty{padding-block:56px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:12px;max-width:40rem}
.empty h3{font-size:1.7rem;font-style:italic}
.empty p{margin:0;color:var(--graphite)}

.import{margin-top:36px;border-top:1px solid var(--line);padding-top:24px;display:flex;flex-direction:column;gap:14px}

/* Cliente */
.back{margin-bottom:28px;display:inline-block}
.cl-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px;align-items:end;padding-bottom:32px;border-bottom:1px solid var(--ink)}
.cl-head h1{font-size:clamp(2.4rem,6vw,4.2rem);line-height:1.02;overflow-wrap:anywhere}
.cl-head .sub{color:var(--muted);margin-top:14px;font-size:.92rem}
.cl-side{display:flex;flex-direction:column;align-items:flex-end;gap:14px}
.sel{background:transparent;border:1px solid var(--line-strong);padding:10px 34px 10px 14px;font-size:.78rem;letter-spacing:.06em;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;border-radius:0}
@media (max-width:760px){.cl-head{grid-template-columns:1fr}.cl-side{align-items:flex-start}}
.tabs{display:flex;gap:32px;border-bottom:1px solid var(--line);margin-bottom:40px}
.tabs button{padding:18px 0 16px;font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--ink)}

.gen-cta{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:32px;align-items:center;padding-block:40px;border-bottom:1px solid var(--line)}
.gen-cta h2{font-size:clamp(1.7rem,4vw,2.4rem);font-style:italic}
.gen-cta p{margin:10px 0 0;color:var(--graphite);max-width:34rem}
@media (max-width:700px){.gen-cta{grid-template-columns:1fr}}
.brain-ico{width:18px;height:18px;flex:none}
.gen-run{padding-block:44px;display:flex;flex-direction:column;gap:18px;border-bottom:1px solid var(--line)}
.gen-run .bar{height:1px;background:var(--line);position:relative;overflow:hidden}
.gen-run .bar i{position:absolute;inset:0 auto 0 0;background:var(--ink);transition:width .6s var(--ease)}
.gen-run .serif{font-size:1.6rem;font-style:italic}
.note{font-size:.88rem;color:var(--alert)}

.brain-top{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:36px}
.brain-top h2{font-size:clamp(1.6rem,3.6vw,2.3rem);letter-spacing:.02em}
.brain-top .lbl{color:var(--muted);display:block;margin-bottom:10px}
.brain-stats{font-size:.86rem;color:var(--muted);margin-top:8px}
.secs{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.sec{display:grid;grid-template-columns:72px minmax(0,1fr);gap:20px;padding-block:28px;border-bottom:1px solid var(--line)}
.sec .no{font-family:var(--serif);font-size:1.5rem;color:var(--muted);font-variant-numeric:tabular-nums lining-nums;line-height:1.1}
.sec h3{font-size:1.5rem;margin-bottom:12px}
.sec .tx{color:var(--graphite);max-width:44rem;display:flex;flex-direction:column;gap:10px}
.sec .tx p{margin:0}
.sec .tx ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px}
mark.tbc{background:transparent;color:var(--alert);font-size:.72rem;letter-spacing:.12em;font-weight:600;border:1px solid currentColor;padding:1px 6px;white-space:nowrap}
@media (max-width:600px){.sec{grid-template-columns:44px minmax(0,1fr);gap:12px}}

.answers{display:flex;flex-direction:column;gap:56px}
.ans-step h3{font-size:1.7rem;margin-bottom:6px}
.ans-step .lbl{color:var(--muted)}
.qa{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:24px;padding-block:14px;border-bottom:1px solid var(--line)}
.qa dt{color:var(--muted);font-size:.9rem}
.qa dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.qa dd.none{color:var(--line-strong);font-style:italic}
@media (max-width:640px){.qa{grid-template-columns:1fr;gap:4px}}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--paper);padding:14px 22px;font-size:.88rem;opacity:0;pointer-events:none;transition:opacity .35s var(--ease),transform .35s var(--ease);max-width:calc(100vw - 32px);z-index:50}
.toast.on{opacity:1;transform:translate(-50%,0)}
.closed{min-height:calc(100vh - 66px);display:flex;align-items:center;text-align:center;padding-block:64px}

const LS = 'isyn.briefing.v1';

const S = {

const $ = s => document.querySelector(s);
const app = $('#app');

const BRAIN_SVG = '<svg class="brain-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M12 5.5c-1-1.6-3.6-1.9-4.9-.4-1.6-.1-2.9 1.5-2.4 3.1-1.6.8-1.9 3.1-.5 4.2-.6 1.7.6 3.6 2.4 3.6.5 1.7 2.6 2.4 4 1.4.5.6 1 .9 1.4 1V5.5z"/><path d="M12 5.5c1-1.6 3.6-1.9 4.9-.4 1.6-.1 2.9 1.5 2.4 3.1 1.6.8 1.9 3.1.5 4.2.6 1.7-.6 3.6-2.4 3.6-.5 1.7-2.6 2.4-4 1.4-.5.6-1 .9-1.4 1"/><path d="M8.5 9.5c1 .2 1.8 1 2 2M15.5 9.5c-1 .2-1.8 1-2 2M8 14c1.2-.3 2.4.1 3 1M16 14c-1.2-.3-2.4.1-3 1"/></svg>';

/* ================= Persistência local (rascunho deste dispositivo) ================= */
function loadLocal(){
  try{
    const raw = localStorage.getItem(LS); if(!raw) return;
    const s = JSON.parse(raw);
    S.answers = s.answers || {}; S.images = s.images || []; S.step = Math.min(s.step||0, STEPS.length-1);
    S.updatedAt = s.updatedAt || 0; S.submitted = !!s.submitted; S.submittedAt = s.submittedAt || null; S.savedAt = s.updatedAt || null;
  }catch(e){}
}
function saveLocal(){
  const base = {answers:S.answers, step:S.step, updatedAt:S.updatedAt, submitted:S.submitted, submittedAt:S.submittedAt};
  try{ localStorage.setItem(LS, JSON.stringify({...base, images:S.images})); }
  catch(e){ try{ localStorage.setItem(LS, JSON.stringify(base)); }catch(_){} }
}
const hasDraft = () => Object.values(S.answers).some(v => Array.isArray(v) ? v.length : String(v||'').trim());

/* ================= Persistência remota (db) ================= */
let saveTimer = null, chain = Promise.resolve();
const dirtyImgs = new Set(), removedImgs = new Set();
function touch(){
  S.updatedAt = Date.now(); S.pending = true; saveLocal(); paintSaved();
  clearTimeout(saveTimer); saveTimer = setTimeout(flush, 1600);
}
function flush(){
  clearTimeout(saveTimer);
  chain = chain.then(pushRemote).catch(()=>{}).then(() => { S.pending = false; S.savedAt = Date.now(); saveLocal(); paintSaved(); });
  return chain;
}
async function pushRemote(){
  if(!cap.db || !cap.uid || cap.writable === false) return;
  const ref = cap.db.doc('briefings/' + cap.uid);
  try{
    await ref.set({
      nome: S.answers.nome || '', answers: S.answers, step: S.step,
      status: S.submitted ? 'enviado' : 'rascunho', updatedAt: S.updatedAt,
      submittedAt: S.submittedAt || null, imageCount: S.images.length
    });
    for(const id of [...dirtyImgs]){
      const im = S.images.find(i => i.id === id);
      if(im) await ref.collection('refs').doc(id).set({dataUrl:im.dataUrl, name:im.name||'', at:Date.now()});
      dirtyImgs.delete(id);
    }
    for(const id of [...removedImgs]){ await ref.collection('refs').doc(id).delete(); removedImgs.delete(id); }
    cap.writable = true;
  }catch(e){
    if(e && (e.code === 'invalid_argument' || e.code === 'not_granted' || e.code === 'revoked')) cap.writable = false;
    else if(e && e.code === 'quota_exceeded') toast('O espaço de armazenamento está cheio. Suas respostas continuam salvas neste dispositivo.');
  }
}
async function loadRemoteDraft(){
  if(!cap.db || !cap.uid) return;
  try{
    const ref = cap.db.doc('briefings/' + cap.uid);
    const snap = await ref.get();
    if(!snap.exists) return;
    const d = snap.data();
    if((d.updatedAt||0) <= S.updatedAt) return;
    S.answers = {...(d.answers||{})}; S.step = Math.min(d.step||0, STEPS.length-1);
    S.updatedAt = d.updatedAt; S.savedAt = d.updatedAt; S.submitted = d.status === 'enviado'; S.submittedAt = d.submittedAt || null;
    const imgs = await ref.collection('refs').get();
    S.images = imgs.docs.filter(x=>x.exists).map(x => ({id:x.id, dataUrl:x.data().dataUrl, name:x.data().name}));
    cap.writable = true;
    saveLocal();
    if(S.view === 'intro' || S.view === 'step') render();
  }catch(e){}
}

/* ================= Capacidades ================= */
async function initCaps(){
  if(!window.claude || !window.claude.use) return;
  const get = n => window.claude.use(n).catch(() => null);
  [cap.db, cap.user, cap.sample, cap.downloads] = await Promise.all([get('db'), get('user'), get('sample'), get('downloads')]);
  if(cap.user){
    cap.uid = await cap.user.id().catch(() => null);
    cap.admin = !!(await cap.user.canEdit().catch(() => false));
  }
  renderChrome();
  await loadRemoteDraft();
  if(cap.admin && location.hash === '#central') go('central');
}

/* ================= Navegação ================= */
function go(view, opts={}){
  S.view = view;
  if(opts.step != null) S.step = opts.step;
  closeMenu();
  if(view === 'central' || view === 'client'){ subscribeCentral(); try{ history.replaceState(null,'','#central'); }catch(e){} }
  else { try{ if(location.hash) history.replaceState(null,'',location.pathname + location.search); }catch(e){} }
  render();
  window.scrollTo({top:0, behavior: opts.smooth ? 'smooth' : 'auto'});
}
function render(){
  renderChrome();
  const v = S.view;
  if(v === 'intro') app.innerHTML = viewIntro();
  else if(v === 'step') app.innerHTML = viewStep();
  else if(v === 'done') app.innerHTML = viewDone();
  else if(v === 'closed') app.innerHTML = viewClosed();
  else if(v === 'central') app.innerHTML = viewCentral();
  else if(v === 'client') app.innerHTML = viewClient();
  app.querySelectorAll('textarea.in').forEach(autosize);
}

/* ================= Header ================= */
function renderChrome(){
  const inCentral = S.view === 'central' || S.view === 'client';
  const nav = $('#topNav'), sheet = $('#sheet');
  let items = [];
  if(inCentral){
    nav.innerHTML = `<span class="lbl here">Central Estratégica</span><button class="tlink" data-act="to-briefing">Briefing</button>`;
    items = [['to-briefing','Briefing']];
  } else {
    nav.innerHTML = `<span class="lbl here">Briefing</span><button class="tlink" data-act="save">Salvar e continuar</button>` +
      (cap.admin ? `<button class="tlink" data-act="to-central" style="color:var(--muted)">Central</button>` : '');
    items = [['save','Salvar e continuar']];
    if(cap.admin) items.push(['to-central','Central Estratégica']);
  }
  sheet.innerHTML = `<span class="lbl" style="color:var(--muted);padding-top:12px">${inCentral ? 'Central Estratégica' : 'Briefing'}</span>` +
    items.map(([a,t]) => `<button class="lbl" data-act="${a}" style="color:var(--ink)">${t}</button>`).join('');
  const prog = $('#progress');
  prog.hidden = S.view !== 'step';
  if(S.view === 'step') prog.firstElementChild.style.width = ((S.step+1)/STEPS.length*100) + '%';
}
function closeMenu(){ $('#sheet').hidden = true; $('#menuBtn').setAttribute('aria-expanded','false'); }
$('#menuBtn').addEventListener('click', () => {
  const open = $('#sheet').hidden; $('#sheet').hidden = !open; $('#menuBtn').setAttribute('aria-expanded', String(open));
});

/* ================= Telas do cliente ================= */
function viewIntro(){
  const resume = hasDraft() && !S.submitted;
  return `<section class="intro wrap"><div class="col">
    <span class="logo" role="img" aria-label="ISYN Co."></span>
    <span class="rule"></span>
    <h1>Vamos conhecer a sua marca.</h1>
    <div class="copy stage" style="animation-delay:.35s">
      <p>Antes de criar qualquer conteúdo, precisamos entender o que torna sua marca única.</p>
      <p>Este briefing foi desenvolvido pela ISYN Co. para transformar informações sobre sua empresa em uma base estratégica de comunicação.</p>
    </div>
    <div class="meta-row stage" style="animation-delay:.5s">
      <div><span class="lbl">Tempo estimado</span><b>8–12 minutos</b></div>
      <div><span class="lbl">Etapas</span><b>8</b></div>
      <div><span class="lbl">Salvamento</span><b>Automático</b></div>
    </div>
    <div class="actions stage" style="animation-delay:.65s">
      ${resume
        ? `<button class="btn" data-act="resume">Continuar de onde parei ${ARROW}</button>
           <span class="hint">Etapa ${pad(S.step+1)} de ${pad(STEPS.length)} · ${S.savedAt ? 'salvo às ' + hhmm(S.savedAt) : 'rascunho salvo'}</span>`
        : S.submitted
          ? `<button class="btn" data-act="start">Revisar meu briefing ${ARROW}</button><span class="hint">Seu briefing já foi enviado. Alterações continuam sendo salvas.</span>`
          : `<button class="btn" data-act="start">Começar briefing ${ARROW}</button>
             <span class="hint">Suas respostas serão salvas automaticamente.</span>`}
    </div>
  </div></section>`;
}

function savedText(){
  if(S.pending) return {cls:'pending', t:'Salvando…'};
  if(!S.savedAt) return {cls:'pending', t:'Salvamento automático ativo'};
  return {cls:'', t:(cap.writable ? 'Salvo' : 'Salvo neste dispositivo') + ' · ' + hhmm(S.savedAt)};
}
function paintSaved(){
  const el = document.getElementById('saved'); if(!el) return;
  const s = savedText(); el.className = 'saved ' + s.cls; el.textContent = s.t;
}

function fieldHTML(f){
  if(f.group) return `<div class="group-title"><span class="lbl">${esc(f.group)}</span></div>`;
  const v = S.answers[f.id];
  const id = 'f_' + f.id;
  const hint = f.hint ? `<span class="hint">${esc(f.hint)}</span>` : '';
  const ph = f.ph ? ` placeholder="${esc(f.ph)}"` : '';
  switch(f.type){
    case 'text':
      return `<div class="f ${f.half?'half':''}"><label for="${id}">${esc(f.label)}</label>${hint}
        <input class="in" id="${id}" data-f="${f.id}" type="text" autocomplete="off"${f.inputmode?` inputmode="${f.inputmode}"`:''}${ph} value="${esc(v||'')}">
        ${f.req ? `<span class="err" id="err_${f.id}" hidden></span>` : ''}</div>`;
    case 'area':
      return `<div class="f ${f.half?'half':''}"><label for="${id}">${esc(f.label)}</label>${hint}
        <textarea class="in" id="${id}" data-f="${f.id}" rows="1"${ph}>${esc(v||'')}</textarea></div>`;
    case 'feature':
      return `<div class="feature"><span class="lbl">${esc(f.tag||'')}</span><label class="q" for="${id}">${esc(f.label)}</label>
        <textarea class="in" id="${id}" data-f="${f.id}" rows="3" placeholder="Escreva com suas palavras…">${esc(v||'')}</textarea></div>`;
    case 'complete':
      return `<div class="complete"><span class="lbl">Complete</span><div class="complete-line"><span>Somos a marca que</span>
        <input class="in" id="${id}" data-f="${f.id}" type="text" autocomplete="off" placeholder="…" value="${esc(v||'')}" aria-label="Somos a marca que"></div></div>`;
    case 'chips': {
      const sel = Array.isArray(v) ? v : [];
      const full = f.max && sel.length >= f.max;
      return `<div class="f"><span class="q" id="${id}">${esc(f.label)}</span>
        <span class="hint" id="hint_${f.id}">${f.max ? `Escolha até ${f.max} · ${sel.length} de ${f.max}` : 'Selecione quantos quiser'}</span>
        <div class="chips" role="group" aria-labelledby="${id}">${f.options.map(o => {
          const on = sel.includes(o);
          return `<button type="button" class="chip" data-chip="${f.id}" data-v="${esc(o)}" aria-pressed="${on}"${!on && full ? ' aria-disabled="true"' : ''}>${esc(o)}</button>`;
        }).join('')}</div></div>`;
    }
    case 'radio': {
      let opts = f.options;
      if(f.from){ const picked = S.answers[f.from] || []; opts = picked.length ? picked : STEPS.flatMap(s=>s.fields).find(x=>x.id===f.from).options; }

function richText(t){
  const lines = String(t||'').split(/\n+/).map(s => s.trim()).filter(Boolean);
  let out = '', list = [];
  const mark = s => esc(s).split(esc(TBC)).join(`<mark class="tbc">NECESSÁRIO CONFIRMAR</mark>`);
  const flushList = () => { if(list.length){ out += '<ul>' + list.map(l => `<li>${mark(l)}</li>`).join('') + '</ul>'; list = []; } };
  lines.forEach(l => { if(/^[-•*]\s+/.test(l)) list.push(l.replace(/^[-•*]\s+/,'')); else { flushList(); out += `<p>${mark(l)}</p>`; } });
  flushList();
  return out || `<p><mark class="tbc">NECESSÁRIO CONFIRMAR</mark></p>`;
}

function briefingText(b){
  const a = b.answers || {};
  return STEPS.map((st,i) => {
    const lines = st.fields.filter(f => !f.group).map(f => {
      if(f.type === 'files') return `- ${f.label}: ${b.imageCount ? b.imageCount + ' imagem(ns) de referência enviada(s) (conteúdo visual não descrito)' : '(sem resposta)'}`;
      const label = f.type === 'complete' ? 'Complete: "Somos a marca que…"' : f.label;
      const t = valueText(f, a[f.id]);
      return `- ${label}: ${t || '(sem resposta)'}`;
    });
    return `## Etapa ${pad(i+1)} — ${st.title}\n` + lines.join('\n');
  }).join('\n\n');
}
function brainPrompt(b){
  return `Você é estrategista sênior da ISYN Co., agência de social media, estratégia de conteúdo e soluções digitais. A partir do briefing abaixo, monte o CÉREBRO DO CLIENTE: a base estratégica que a equipe vai consultar para criar conteúdo.

REGRAS
- Use somente o que está no briefing. Nunca invente dados, números, nomes, públicos, produtos, datas ou fatos.
- Você pode organizar, resumir e conectar as respostas, e tirar conclusões estratégicas diretas, desde que se apoiem claramente no que foi respondido.
- Quando uma seção não tiver informação suficiente, escreva ${TBC} seguido, na mesma linha, do que precisa ser perguntado ao cliente.
- "Oportunidades" deve partir apenas de cruzamentos entre respostas reais (ex.: um elogio frequente que ainda não aparece na comunicação).
- "Informações pendentes" lista tudo que ficou sem resposta, vago ou contraditório, uma linha por item.
- Português do Brasil, tom profissional e direto. Use parágrafos curtos e linhas iniciadas com "- " para listas. Não use markdown além disso. Não use emojis.

FORMATO
Responda apenas com JSON válido, sem texto antes ou depois:
{"secoes":[{"titulo":"Identidade","conteudo":"..."}, ...]}
Exatamente 20 seções, nesta ordem e com estes títulos:
${BRAIN_SECTIONS.map((t,i) => `${i+1}. ${t}`).join('\n')}

BRIEFING — ${clientName(b)}
${briefingText(b)}`;
}
let genCtl = null;
async function generate(id){
  const b = S.briefs[id]; if(!b || !cap.sample || S.gen) return;
  const prev = statusOf(id);
  S.genErr = '';
  S.gen = {id, msg:'Lendo o briefing…', pct:3};
  genCtl = new AbortController();
  render();
  setCrm(id, {status:'construcao'});
  try{
    const res = await cap.sample.json(brainPrompt(b), {
      modelTier:'complex', cache:false, signal:genCtl.signal,
      onText: ({text}) => {
        const n = (text.match(/"titulo"\s*:/g) || []).length;
        if(!S.gen) return;
        S.gen.msg = n ? `Escrevendo ${pad(Math.min(n,20))} de 20 · ${BRAIN_SECTIONS[Math.min(n,20)-1]}` : 'Organizando a estrutura…';
        S.gen.pct = Math.max(5, Math.min(98, n/20*100));
        const m = document.getElementById('genMsg'), bar = document.getElementById('genBar');
        if(m) m.textContent = S.gen.msg; if(bar) bar.style.width = S.gen.pct + '%';
      }
    });
    const arr = Array.isArray(res?.secoes) ? res.secoes : [];
    const sections = BRAIN_SECTIONS.map((t,i) => ({titulo:t, conteudo: String(arr[i]?.conteudo || TBC).trim()}));
    const old = (S.crm[id] || {}).brain;
    const brain = {version: old ? (old.version||1) + 1 : 1, generatedAt: Date.now(), sections};
    S.gen = null;
    await setCrm(id, {status: prev === 'estrategia' ? 'estrategia' : 'concluido', brain});
    toast(`Cérebro V${brain.version} gerado.`);
  }catch(e){
    S.gen = null;
    const code = e && e.code;
    S.genErr = code === 'cancelled' ? '' :
      code === 'not_granted' ? 'A permissão para usar o Claude nesta página foi recusada.' :
      code === 'rate_limited' ? 'Muitas gerações em pouco tempo. Tente novamente em alguns minutos.' :
      code === 'invalid_json' ? 'A resposta veio incompleta. Gere novamente.' :
      'Não foi possível gerar agora. Tente novamente.';
    await setCrm(id, {status: prev});
  }
  genCtl = null;
  render();
}

    brain.sections.map((s,i) => `## ${i+1}. ${s.titulo}\n\n${s.conteudo}\n`).join('\n');
}

let toastT;

function autosize(el){ el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; }
async function copy(text, okMsg, fallbackEl){

}
function compress(file){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1100 / Math.max(img.width, img.height));
      const w = Math.round(img.width*k), h = Math.round(img.height*k);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0,0,w,h); x.drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      let q = .8, d = c.toDataURL('image/jpeg', q);
      while(d.length > 170000 && q > .35){ q -= .1; d = c.toDataURL('image/jpeg', q); }
      resolve(d);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(); };
    img.src = url;
  });
}
async function addFiles(files){
  const list = [...files].filter(f => f.type.startsWith('image/'));
  const room = MAX_IMG - S.images.length;
  if(!list.length) return;
  if(room <= 0){ toast(`Limite de ${MAX_IMG} imagens atingido.`); return; }
  for(const f of list.slice(0, room)){
    try{ const dataUrl = await compress(f); const id = 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
      S.images.push({id, dataUrl, name:f.name}); dirtyImgs.add(id); }catch(e){ toast(`Não foi possível ler ${f.name}.`); }
  }
  if(list.length > room) toast(`Só cabem ${MAX_IMG} imagens. ${list.length - room} ficaram de fora.`);
  touch(); render();
}
function validateStep(){
  if(S.step === 0 && !String(S.answers.nome||'').trim()){
    const e = document.getElementById('err_nome'); if(e){ e.textContent = 'Informe o nome da empresa para continuar.'; e.hidden = false; }
    const i = document.getElementById('f_nome'); if(i){ i.focus(); i.scrollIntoView({block:'center', behavior:'smooth'}); }
    return false;
  }
  return true;
}
function importBriefing(){
  const raw = S.importText.trim();
  try{
    if(!raw.startsWith('ISYN1:')) throw 0;
    const p = JSON.parse(decodeURIComponent(escape(atob(raw.slice(6).replace(/\s+/g,'')))));
    if(!p || typeof p.answers !== 'object') throw 0;
    const id = 'imp-' + Date.now().toString(36);
    cap.db.doc('briefings/' + id).set({nome:p.answers.nome||'', answers:p.answers, step:7, status:'enviado', updatedAt:p.at||Date.now(), submittedAt:p.at||Date.now(), imageCount:0, imported:true})
      .then(() => { S.importText = ''; S.importErr = ''; S.importOpen = false; toast('Briefing importado.'); render(); })
      .catch(() => { S.importErr = 'Não foi possível salvar. Verifique se você tem acesso de editor.'; render(); });
  }catch(e){ S.importErr = 'Código inválido. Confira se ele foi copiado inteiro, começando por ISYN1:'; render(); }
}

/* ================= Eventos ================= */
document.addEventListener('input', e => {
  const el = e.target;
  if(el.matches('[data-f]')){
    S.answers[el.dataset.f] = el.value;
    if(el.tagName === 'TEXTAREA') autosize(el);
    if(el.dataset.f === 'nome'){ const er = document.getElementById('err_nome'); if(er) er.hidden = true; }
    touch();
  } else if(el.id === 'importIn'){ S.importText = el.value; autosize(el); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if(el.id === 'fileIn'){ addFiles(el.files); el.value = ''; }
  if(el.id === 'stSel' && S.clientId){ setCrm(S.clientId, {status: el.value}); render(); }
});
document.addEventListener('submit', e => e.preventDefault());
document.addEventListener('dragover', e => { const d = e.target.closest && e.target.closest('#drop'); if(d){ e.preventDefault(); d.classList.add('over'); } });
document.addEventListener('dragleave', e => { const d = e.target.closest && e.target.closest('#drop'); if(d) d.classList.remove('over'); });
document.addEventListener('drop', e => { const d = e.target.closest && e.target.closest('#drop'); if(d){ e.preventDefault(); d.classList.remove('over'); addFiles(e.dataTransfer.files); } });

document.addEventListener('click', e => {
  const chip = e.target.closest('[data-chip]');
  if(chip){
    const fid = chip.dataset.chip, v = chip.dataset.v;
    const f = STEPS.flatMap(s => s.fields).find(x => x.id === fid);
    const cur = Array.isArray(S.answers[fid]) ? [...S.answers[fid]] : [];
    const i = cur.indexOf(v);
    if(i >= 0) cur.splice(i,1);
    else if(f.max && cur.length >= f.max){ toast(`Escolha no máximo ${f.max}. Desmarque uma para trocar.`); return; }
    else cur.push(v);
    S.answers[fid] = cur;
    if(fid === 'objetivos' && S.answers.prioridade && cur.length && !cur.includes(S.answers.prioridade)) S.answers.prioridade = '';
    touch(); const y = window.scrollY; render(); window.scrollTo(0, y);
    const again = document.querySelector(`[data-chip="${fid}"][data-v="${CSS.escape(v)}"]`); if(again) again.focus({preventScroll:true});
    return;
  }
  const radio = e.target.closest('[data-radio]');
  if(radio){
    S.answers[radio.dataset.radio] = radio.dataset.v; touch();
    document.querySelectorAll(`[data-radio="${radio.dataset.radio}"]`).forEach(r => r.setAttribute('aria-checked', String(r === radio)));
    return;
  }
  const btn = e.target.closest('[data-act]'); if(!btn) return;
  const act = btn.dataset.act;
  switch(act){
    case 'home': go(S.view === 'central' || S.view === 'client' ? 'central' : 'intro'); break;
    case 'start': go('step', {step:0}); break;
    case 'resume': go('step'); break;
    case 'next': if(validateStep()){ S.step++; touch(); go('step'); } break;
    case 'prev': S.step = Math.max(0, S.step-1); go('step'); break;
    case 'submit':
      S.submitted = true; S.submittedAt = S.submittedAt || Date.now(); touch();
      btn.disabled = true;
      flush().then(() => go('done'));
      break;
    case 'finish': go('closed'); break;
    case 'save':
      closeMenu(); touch();
      flush().then(() => toast(cap.writable ? 'Respostas salvas. Abra este mesmo link para continuar depois.' : 'Respostas salvas neste dispositivo. Volte por este navegador para continuar.'));
      break;
    case 'copy-code': copy(exportCode(), 'Código copiado.', document.getElementById('codeBox')); break;
    case 'dl-code': save(`briefing-${(S.answers.nome||'isyn').toLowerCase().replace(/[^a-z0-9]+/g,'-')}.txt`, exportCode()); break;
    case 'rm-img':
      S.images = S.images.filter(i => i.id !== btn.dataset.id); dirtyImgs.delete(btn.dataset.id); removedImgs.add(btn.dataset.id); touch(); render(); break;
    case 'to-central': go('central'); break;
    case 'to-briefing': go(hasDraft() && !S.submitted ? 'step' : 'intro'); break;
    case 'filter': S.filter = btn.dataset.v; render(); break;
    case 'open': S.clientId = btn.dataset.id; S.tab = 'cerebro'; S.genErr = ''; go('client'); break;
    case 'tab': S.tab = btn.dataset.v; render(); break;
    case 'gen': generate(S.clientId); break;
    case 'gen-cancel': if(genCtl) genCtl.abort(); break;
    case 'copy-brain': copy(brainMarkdown(S.clientId), 'Cérebro copiado.', document.querySelector('.secs')); break;
    case 'dl-brain': { const b = S.briefs[S.clientId], br = S.crm[S.clientId].brain;
      save(`cerebro-${clientName(b).toLowerCase().replace(/[^a-z0-9]+/g,'-')}-v${br.version}.md`, brainMarkdown(S.clientId)); break; }
    case 'import-toggle': S.importOpen = !S.importOpen; S.importErr = ''; render(); break;
    case 'import-do': importBriefing(); break;
  }
});
window.addEventListener('resize', () => app.querySelectorAll('textarea.in').forEach(autosize));

/* ================= Início ================= */
loadLocal();
render();
initCaps();
})();
</script>
